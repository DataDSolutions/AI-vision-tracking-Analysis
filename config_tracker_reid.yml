%YAML:1.0
################################################################################
# NvDCF (accuracy) + ReID re-association — DeepStream 9.1 / Jetson Orin Nano


BaseConfig:
  minDetectorConfidence: 0.20   
  checkClassMatch: 0           
TargetManagement:
  enableBboxUnClipping: 1
  preserveStreamUpdateOrder: 1
  maxTargetsPerStream: 60       
  minIouDiff4NewTarget: 0.30   
  minTrackerConfidence: 0.15   
  probationAge: 3               
  maxShadowTrackingAge: 450     
  earlyTerminationAge: 3        

TrajectoryManagement:
  useUniqueID: 0
  enableReAssoc: 1              
  minMatchingScore4Overall: 0.50
  minTrackletMatchingScore: 0.30
  minMatchingScore4ReidSimilarity: 0.35
  matchingScoreWeight4TrackletSimilarity: 0.70
  matchingScoreWeight4ReidSimilarity: 0.35
  minTrajectoryLength4Projection: 20
  prepLength4TrajectoryProjection: 58
  trajectoryProjectionLength: 33
  maxAngle4TrackletMatching: 67
  minSpeedSimilarity4TrackletMatching: 0.0574
  minBboxSizeSimilarity4TrackletMatching: 0.1013
  maxTrackletMatchingTimeSearchRange: 150
                               
  reidExtractionInterval: 0    

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1     
  minMatchingScore4Overall: 0.0
  minMatchingScore4SizeSimilarity: 0.30
  minMatchingScore4Iou: 0.10
  minMatchingScore4VisualSimilarity: 0.40
  matchingScoreWeight4VisualSimilarity: 0.40
  matchingScoreWeight4SizeSimilarity: 0.20
  matchingScoreWeight4Iou: 0.40
  tentativeDetectorConfidence: 0.20
  minMatchingScore4TentativeIou: 0.25

StateEstimator:
  stateEstimatorType: 1          # SIMPLE_BBOX_KF (NvDCF standard)
  processNoiseVar4Loc: 6810.8668
  processNoiseVar4Size: 1541.8647
  processNoiseVar4Vel: 1348.4874
  measurementNoiseVar4Detector: 100.0000
  measurementNoiseVar4Tracker: 293.3238

VisualTracker:
  visualTrackerType: 1           # NvDCF (CPU/GPU). Use 2 (NvDCF_VPI) only if VPI
                                # crop path is verified on your JetPack build.
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 2         
  featureFocusOffsetFactor_y: -0.1054
  filterLr: 0.0767
  filterChannelWeightsLr: 0.0339
  gaussianSigma: 0.5687

ReID:
  reidType: 2                    # Re-ID based re-association (works with NvDCF)
  outputReidTensor: 1            # publish features to user-meta for cross-cam
  batchSize: 100
  workspaceSize: 1000
  reidFeatureSize: 256
  reidHistorySize: 100
  inferDims: [3, 256, 128]
  networkMode: 1                 # FP16
  inputOrder: 0                  # NCHW
  colorFormat: 0                 # RGB
  offsets: [123.6750, 116.2800, 103.5300]
  netScaleFactor: 0.01735207
  keepAspc: 1
  useVPICropScaler: 0
  addFeatureNormalization: 1
  minVisibility4GalleryUpdate: 0.6
  onnxFile: "/home/<username>/DeepStream-Yolo/trackers/reid/resnet50_market1501_aicity156.onnx"
  modelEngineFile: "/home/<username>/DeepStream-Yolo/trackers/reid/resnet50_market1501_aicity156.onnx_b100_gpu0_fp16.engine"
